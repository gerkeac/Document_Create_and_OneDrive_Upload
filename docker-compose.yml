# Docker Compose configuration for MCP Document Generator Server
# For local development and testing
#
# Port Configuration:
# - Set MCP_EXTERNAL_PORT in .env to change the host port (default: 3000)
# - Set MCP_SERVER_PORT in .env to change the container port (default: 3000)
# - Example: MCP_EXTERNAL_PORT=8080 maps host:8080 -> container:3000

services:
  mcp-document-server:
    # Build from source (works for local dev AND Portainer git builds)
    build:
      context: .
      dockerfile: Dockerfile

    # Alternative: Use pre-built image instead of building
    # Uncomment this line and comment out the 'build' section above:
    # image: your-registry/mcp-document-server:latest

    container_name: mcp-document-server

    # Logging configuration - prevent Docker logs from filling disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Maximum size of each log file
        max-file: "3"        # Keep maximum 3 log files (30MB total)
        compress: "true"     # Compress rotated logs

    ports:
      - "${MCP_EXTERNAL_PORT:-3000}:${MCP_SERVER_PORT:-3000}"
    environment:
      # MCP Server Configuration
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3000}
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_BASE_URL=${MCP_BASE_URL:-}

      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/logs/mcp_server.log
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-10485760}    # 10MB per file (default)
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-5}     # Keep 5 backup files (60MB total)

      # Microsoft OAuth Configuration (Optional - enables OAuth capability broadcasting)
      # When configured, the server broadcasts OAuth requirements via MCP protocol
      # Clients like LibreChat can auto-discover and handle OAuth flow automatically
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      - MICROSOFT_OAUTH_SCOPES=${MICROSOFT_OAUTH_SCOPES:-Files.ReadWrite User.Read offline_access}
      - MCP_AUTH_REDIRECT_PATH=${MCP_AUTH_REDIRECT_PATH:-/oauth/callback}

      # For testing without LibreChat (not recommended for production)
      - MICROSOFT_ACCESS_TOKEN=${MICROSOFT_ACCESS_TOKEN:-}

      # OneDrive Defaults
      - DEFAULT_ONEDRIVE_PATH=/Documents/LibreChat

    volumes:
      # Application logs
      - ./logs:/logs

      # Development: Mount source code for hot-reload (comment out in production)
      - ./src:/app/src

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "from mcp_document_server.server import TEMP_DIR; assert TEMP_DIR.exists()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

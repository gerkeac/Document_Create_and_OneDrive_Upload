# Docker Compose configuration for Portainer deployment
# This version uses a pre-built image and doesn't require build context
#
# Usage in Portainer:
# 1. Build the image locally: docker build -t mcp-document-server:latest .
# 2. Push to a registry (Docker Hub, GitHub Container Registry, etc.)
# 3. Update the 'image' field below with your registry URL
# 4. Deploy this file in Portainer
#
# Port Configuration:
# - Set MCP_EXTERNAL_PORT in Portainer environment to change the host port (default: 3000)
# - Set MCP_SERVER_PORT in Portainer environment to change the container port (default: 3000)

services:
  mcp-document-server:
    # Replace with your image repository
    # Examples:
    #   - Docker Hub: username/mcp-document-server:latest
    #   - GitHub: ghcr.io/username/mcp-document-server:latest
    #   - Self-hosted: registry.yourdomain.com/mcp-document-server:latest
    image: mcp-document-server:latest

    container_name: mcp-document-server

    ports:
      - "${MCP_EXTERNAL_PORT:-3000}:${MCP_SERVER_PORT:-3000}"

    environment:
      # MCP Server Configuration
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-3000}
      - MCP_SERVER_HOST=0.0.0.0

      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/logs/mcp_server.log

      # Microsoft OAuth - NOT NEEDED HERE
      # OAuth tokens are passed by LibreChat via Authorization header
      # LibreChat handles token storage, refresh, and encryption
      # This server operates statelessly - no token storage required

      # OneDrive Defaults
      - DEFAULT_ONEDRIVE_PATH=/Documents/LibreChat

    volumes:
      # Application logs
      - ./logs:/logs

      # Development: Mount source code for hot-reload (comment out in production)
      # - ./src:/app/src

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "from mcp_document_server.server import TEMP_DIR; assert TEMP_DIR.exists()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
